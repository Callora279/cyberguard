version: "3.9"

services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    ports:
      - "8090:8090"
    environment:
      ENV: production
      DATABASE_URL: postgresql://cyberguard:cyberguard@db:5432/cyberguard
      REDIS_URL: redis://redis:6379/0
      GROQ_API_KEY: ${GROQ_API_KEY:?set GROQ_API_KEY in your environment or .env}
      GROQ_MODEL: qwen/qwen3.8-27b
      CHAKRA_ORG_ID: ${CHAKRA_ORG_ID}
      INTERNAL_SYNC_SECRET: ${INTERNAL_SYNC_SECRET:?set INTERNAL_SYNC_SECRET}
      LIVEGUARD_URL: https://liveguard.goiratech.com/api/errors
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
    depends_on:
      - db
      - redis

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    expose:
      - "3000"
    depends_on:
      - api

  # Edge reverse proxy: serves the whole app on :3000 and proxies /api -> api:8090.
  # The web app only ever uses relative URLs, so there is no API host to configure.
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    command: celery -A core.workers.queue.celery_app worker --beat --loglevel=info
    environment:
      DATABASE_URL: postgresql://cyberguard:cyberguard@db:5432/cyberguard
      REDIS_URL: redis://redis:6379/0
      GROQ_API_KEY: ${GROQ_API_KEY}
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cyberguard
      POSTGRES_PASSWORD: cyberguard
      POSTGRES_DB: cyberguard
    ports:
      - "5432:5432"
    volumes:
      - cyberguard_db:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  cyberguard_db:
