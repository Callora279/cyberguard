# CyberGuard AI — edge reverse proxy.
# The web app calls relative "/api/..." URLs; nginx routes them to the backend.

upstream cyberguard_api { server api:8090; }
upstream cyberguard_web { server web:3000; }

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    # API + Chakra internal endpoint -> FastAPI
    location /api/ {
        proxy_pass http://cyberguard_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /internal/ {
        proxy_pass http://cyberguard_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else -> Next.js
    location / {
        proxy_pass http://cyberguard_web;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
