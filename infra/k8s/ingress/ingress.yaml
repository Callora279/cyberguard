apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cyberguard
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  tls:
    - hosts: [cyberguard.goiratech.com]
      secretName: cyberguard-tls
  rules:
    - host: cyberguard.goiratech.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: cyberguard-api, port: { number: 80 } }
          - path: /internal
            pathType: Prefix
            backend:
              service: { name: cyberguard-api, port: { number: 80 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: cyberguard-web, port: { number: 80 } }
