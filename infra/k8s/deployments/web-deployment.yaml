apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyberguard-web
  labels: { app: cyberguard, component: web }
spec:
  replicas: 2
  selector:
    matchLabels: { app: cyberguard, component: web }
  template:
    metadata:
      labels: { app: cyberguard, component: web }
    spec:
      containers:
        - name: web
          image: ghcr.io/goiratech/cyberguard-web:latest
          ports: [{ containerPort: 3000 }]
          env:
            - name: NEXT_PUBLIC_API_BASE
              value: "https://cyberguard.goiratech.com"
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 300m, memory: 384Mi }
